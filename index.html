    <style>
      @font-face {
        font-family: "Fraunces";
        font-style: normal;

      :root {
        --ink: #202221;
        --surface: #292c2a;
        --paper: #f1efe8;
        --muted: #afb1a9;
        --line: rgba(241, 239, 232, .16);
        --olive: #b3c589;
        --olive-light: #c6d69d;
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; scrollbar-width: none; }
      /* Clear the fixed header, so an anchored section starts below it and not under it. */
      section[id] { scroll-margin-top: 92px; }
      html::-webkit-scrollbar { display: none; }
      body { margin: 0; background: var(--ink); color: var(--paper); font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
      a { color: inherit; text-decoration: none; }
      .shell { width: min(1200px, calc(100% - 48px)); margin: 0 auto; }

      .site-header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; transition: background .35s ease, backdrop-filter .35s ease, box-shadow .35s ease, border-color .35s ease; border-bottom: 1px solid transparent; }
      .site-header::before { content: ""; position: absolute; inset: 0 0 -40px; z-index: -1; background: linear-gradient(180deg, rgba(17, 18, 18, .58) 0%, rgba(17, 18, 18, .28) 52%, transparent 100%); opacity: 1; transition: opacity .35s ease; pointer-events: none; }
      .site-header.is-scrolled { background: rgba(28, 29, 28, .96); backdrop-filter: blur(20px) saturate(150%); -webkit-backdrop-filter: blur(20px) saturate(150%); border-bottom-color: var(--line); box-shadow: 0 12px 34px rgba(0, 0, 0, .28); }
      .site-header.is-scrolled::before { opacity: 0; }
      .nav { height: 84px; display: flex; align-items: center; justify-content: space-between; gap: 24px; transition: height .35s ease; }
      .site-header.is-scrolled .nav { height: 68px; }

      .brand { display: inline-flex; align-items: center; gap: 12px; transition: gap .35s ease; }
      .brand-mark { display: block; width: 34px; height: 34px; flex: none; overflow: visible; transition: width .35s ease, height .35s ease, transform .5s cubic-bezier(.16, 1, .3, 1); }
      .brand-mark .mark-body { fill: var(--paper); }
      .brand-mark .mark-facet { fill: var(--olive); }
      @media (prefers-reduced-motion: no-preference) { .brand-mark .mark-facet { transform-box: fill-box; transform-origin: center; animation: mark-facet-orbit 9s linear infinite; } }
      @keyframes mark-facet-orbit { to { transform: rotate(1turn); } }
      .brand:hover .brand-mark { transform: rotate(72deg); }
      .brand-name { font-family: "Fraunces", Georgia, serif; font-size: 28px; font-weight: 600; letter-spacing: -.025em; line-height: 1; white-space: nowrap; transition: font-size .35s ease; }
      .brand-name span { color: var(--olive); }
      .site-header.is-scrolled .brand { gap: 10px; }
      .site-header.is-scrolled .brand-mark { width: 28px; height: 28px; }
      .site-header.is-scrolled .brand-name { font-size: 23px; }
      .brand:focus-visible { outline: 2px solid var(--olive-light); outline-offset: 6px; }

      .nav-links { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
      .nav-links a { position: relative; padding: 9px 14px; border-radius: 999px; transition: color .2s ease, background .2s ease; }
      .nav-links a:not(.contact-link)::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: 4px; height: 1px; background: currentColor; transform: scaleX(0); transform-origin: left; transition: transform .28s cubic-bezier(.16, 1, .3, 1); }
      .nav-links a:not(.contact-link):hover { color: var(--paper); }
      .nav-links a:not(.contact-link):hover::after { transform: scaleX(1); }
      .nav-links .contact-link { display: inline-flex; align-items: center; gap: 18px; min-height: 44px; margin-left: 10px; padding: 11px 20px; border-radius: 12px; color: var(--ink); font-size: 14px; font-weight: 700; line-height: 1.2; border: 1px solid var(--olive); background: var(--olive); box-shadow: 0 4px 14px rgba(0, 0, 0, .12); transition: background .2s ease, border-color .2s ease, box-shadow .2s ease; }
      .nav-links .contact-link:hover { color: var(--ink); background: var(--olive-light); border-color: var(--olive-light); box-shadow: 0 6px 20px rgba(0, 0, 0, .18); }
      .nav-links .contact-link::after { content: "↗"; font-size: 19px; font-weight: 400; line-height: 1; }
      .nav-links .contact-link:focus-visible { outline: 2px solid var(--paper); outline-offset: 4px; }
      .nav-links .language-link { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 38px; padding: 0; margin-inline: 2px; border-radius: 6px; }
      .nav-links .language-link::after { display: none; }
      .language-flag { display: block; width: 34px; flex: none; border-radius: 1px; box-shadow: 0 0 0 1px rgba(241, 239, 232, .3), 0 3px 10px rgba(0, 0, 0, .2); }
      .flag-hr { height: 17px; }
      .flag-gb { height: 20px; }
      .nav-links .language-link:hover { background: rgba(179, 197, 137, .12); }
      .nav-links a:focus-visible { outline: 2px solid var(--olive-light); outline-offset: 2px; }

      .hero { height: 100dvh; min-height: 620px; padding-top: 84px; position: relative; isolation: isolate; display: flex; align-items: center; overflow: hidden; }
      .hero-content { position: relative; z-index: 1; width: min(1200px, calc(100% - 48px)); margin: 0 auto; transform: translateY(-1cm); }
      .hero-content > div { width: min(62%, 650px); }
      .kicker { margin: 0 0 24px; color: var(--olive); font-size: 11px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
      h1, h2, h3 { margin: 0; font-weight: 700; letter-spacing: -.07em; }
      h1 { max-width: 640px; font-size: clamp(54px, 7vw, 96px); line-height: .89; }
      .hero-copy { max-width: 460px; margin: 30px 0; color: var(--muted); font-size: 18px; line-height: 1.55; }
      .button { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 20px; background: var(--olive); color: var(--ink); font-size: 15px; font-weight: 700; transition: transform .2s ease, background .2s ease; }
      .button:hover { background: var(--olive-light); transform: translateY(-2px); }
      .button:active { transform: translateY(0); }
      /* Hero CTA: oval, self-contained (does not use .button so the two never fight).
         The 3px rim is the aura layer showing through from under the face. */
      .hero-cta { position: relative; isolation: isolate; display: inline-flex; padding: 3px; border-radius: 999px; overflow: hidden; background: rgba(22, 24, 23, .92); -webkit-tap-highlight-color: transparent; touch-action: manipulation; box-shadow: 0 16px 40px -14px rgba(179, 197, 137, .45); transition: transform .34s cubic-bezier(.16, 1, .3, 1), box-shadow .34s ease, background .45s ease; }
      /* One wide, soft arc - a slow glint, not a strobe. A rotating conic sweeps unevenly
         around a wide pill, so it has to be slow and feathered or it reads as wobble. */
      .hero-cta-aura { position: absolute; left: 50%; top: 50%; width: 175%; aspect-ratio: 1; transform: translate(-50%, -50%); background: conic-gradient(from 0deg, rgba(179, 197, 137, .22) 0deg, rgba(198, 214, 157, .5) 70deg, rgba(226, 236, 200, .85) 128deg, rgba(198, 214, 157, .5) 186deg, rgba(179, 197, 137, .22) 250deg, rgba(179, 197, 137, .22) 360deg); transition: opacity .45s ease; }
      .hero-cta-face { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; min-height: 54px; padding: 0 34px; border-radius: 999px; overflow: hidden; background: linear-gradient(118deg, #93a96e 0%, #cbdca6 46%, #9cb476 100%); color: var(--ink); font-size: 15.5px; font-weight: 700; letter-spacing: -.01em; transition: background .34s ease; }
      /* Slow sheen across the face, under the label. */
      .hero-cta-face::before { content: ""; position: absolute; top: -70%; left: 0; width: 36%; height: 240%; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .6), transparent); transform: rotate(18deg) translateX(-280%); pointer-events: none; }
      /* Label swap: both lines stacked in one grid cell, so the pill never changes width. */
      .hero-cta-label { position: relative; z-index: 2; display: grid; overflow: hidden; }
      /* Both labels stretch to fill the shared cell (sized to the longer one), so the
         shorter label needs centring inside it. */
      .hero-cta-text { grid-area: 1 / 1; text-align: center; white-space: nowrap; transition: transform .44s cubic-bezier(.16, 1, .3, 1), opacity .3s ease; }
      .hero-cta-text-alt { transform: translateY(120%); opacity: 0; }
      /* Hover settles the motion: the travelling arc fades out and the rim goes solid. */
      .hero-cta:hover { transform: translateY(-3px); background: rgba(205, 219, 168, .75); box-shadow: 0 24px 50px -14px rgba(179, 197, 137, .55); }
      .hero-cta:hover .hero-cta-aura { opacity: 0; }
      .hero-cta:hover .hero-cta-face { background: linear-gradient(118deg, #a1b77b 0%, #d9e7b8 46%, #accb87 100%); }
      .hero-cta:hover .hero-cta-text-main { transform: translateY(-120%); opacity: 0; }
      .hero-cta:hover .hero-cta-text-alt { transform: translateY(0); opacity: 1; }
      .hero-cta:active { transform: translateY(-1px) scale(.972); box-shadow: 0 10px 24px -12px rgba(179, 197, 137, .6); }
      .hero-cta:focus-visible { outline: 2px solid var(--olive-light); outline-offset: 4px; }
      /* Ripple spawned at the touch point. */
      .hero-cta .ripple { position: absolute; z-index: 1; border-radius: 50%; background: radial-gradient(circle, rgba(255, 255, 255, .6) 0%, rgba(255, 255, 255, .15) 55%, transparent 72%); transform: scale(0); opacity: .9; pointer-events: none; }
      @media (prefers-reduced-motion: no-preference) {
        .hero-cta-aura { animation: cta-orbit 11s linear infinite; }
        .hero-cta-face::before { animation: cta-sheen 5.6s cubic-bezier(.16, 1, .3, 1) infinite; }
        .hero-cta .ripple { animation: cta-ripple .6s cubic-bezier(.22, 1, .36, 1) forwards; }
      }
      @keyframes cta-orbit { to { transform: translate(-50%, -50%) rotate(1turn); } }
      @keyframes cta-sheen { 0%, 42% { transform: rotate(18deg) translateX(-280%); } 74%, 100% { transform: rotate(18deg) translateX(580%); } }
      @keyframes cta-ripple { to { transform: scale(1); opacity: 0; } }
      .hero-image { position: absolute; inset: 0; z-index: -1; overflow: hidden; background: var(--ink); }
      .hero-image::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(17, 18, 18, .24) 0%, rgba(17, 18, 18, .07) 53%, transparent 72%); }
      .hero-image picture { display: block; width: 100%; height: 100%; }
      .hero-image img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center; transform: none; }

      .services { padding: 120px 0; }
      .section-intro { max-width: 640px; }
      h2 { font-size: clamp(42px, 5.4vw, 72px); line-height: .94; }
      .section-copy { max-width: 530px; margin: 22px 0 48px; color: var(--muted); font-size: 17px; line-height: 1.55; }
      .services-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border-top: 1px solid var(--line); }

      .proof-track { display: flex; width: max-content; animation: proof-scroll 27s linear infinite; }

      .work-section { padding: 120px 0; background: #242725; }

      .work-card h3 { color: var(--paper); font-size: clamp(26px, 3vw, 38px); line-height: 1; }

      .product { position: relative; isolation: isolate; display: block; overflow: hidden; padding: 30px 30px 66px 0; min-height: 236px; border-bottom: 1px solid var(--line); transition: transform .28s cubic-bezier(.16, 1, .3, 1), border-color .28s ease; }
      .product + .product { padding-left: 30px; border-left: 1px solid var(--line); }
      .product::before { content: ""; position: absolute; z-index: -1; inset: 0; background: radial-gradient(circle at 50% 115%, rgba(179, 197, 137, .2), transparent 56%); opacity: 0; transition: opacity .32s ease; }
      .product h3 { color: var(--olive); font-size: 25px; transition: color .28s ease; }

      .product.is-link::after { content: "Visit ↗"; position: absolute; left: 0; bottom: 28px; color: var(--olive-light); font-size: 12px; font-weight: 700; opacity: 0; transform: translateY(6px); transition: opacity .24s ease, transform .28s cubic-bezier(.16, 1, .3, 1); }
      .product.is-link + .product.is-link::after { left: 30px; }

      .product.is-link:hover::before, .product.is-link:focus-visible::before, .product.is-link:hover::after, .product.is-link:focus-visible::after { opacity: 1; transform: translateY(0); }
